<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="google-site-verification" content="PkLa_ViOo6FAHpvh8SacceMb95o9tePRdrqLNBz9X1M" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Sample Rate Converter Info - What Changes Between Rates</title>
<meta name="description" content='See what happens when converting audio between sample rates like 44.1kHz, 48kHz and 96kHz, including frequency loss and typical use cases.'>
<meta name="google-site-verification" content="REPLACE_ME">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root{
      --bg:#0d0f11;--panel:#15181b;--line:#262b30;--text:#d8dee3;
      --muted:#7c8791;--accent:#5ec9a6;--accent2:#e8b34f;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;line-height:1.5;padding:32px 16px 64px;}
    .wrap{max-width:640px;margin:0 auto;}
    h1{font-size:20px;margin:0 0 6px;color:#fff;font-weight:600;}
    .desc{color:var(--muted);font-size:13px;margin:0 0 24px;}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:20px;}
    label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;}
    label:first-child{margin-top:0;}
    input, select{width:100%;background:#0a0c0e;border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:4px;font-family:inherit;font-size:14px;}
    input[type=file]{padding:8px;}
    input:focus, select:focus{outline:1px solid var(--accent);}
    button{margin-top:18px;width:100%;background:var(--accent);color:#08110d;border:none;padding:11px;border-radius:4px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;}
    button:hover{opacity:0.9;}
    .result{margin-top:18px;padding:14px;border:1px dashed var(--line);border-radius:4px;font-size:14px;min-height:20px;}
    .result .big{font-size:22px;color:var(--accent2);font-weight:600;display:block;margin-bottom:4px;}
    table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
    th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;}
    th{color:var(--muted);font-weight:600;}
    .note{color:var(--muted);font-size:12px;margin-top:20px;}
    a{color:var(--accent);}
    canvas{max-width:100%;border-radius:4px;border:1px solid var(--line);background:#0a0c0e;}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Audio Sample Rate Converter Info</h1>
  <p class="desc">Select your source and target sample rate to see what the conversion actually does.</p>
  <div class="panel">
    
    <label for="src">Source sample rate</label>
    <select id="src">
      <option value="8000">8,000 Hz (telephone)</option>
      <option value="22050">22,050 Hz</option>
      <option value="44100" selected>44,100 Hz (CD quality)</option>
      <option value="48000">48,000 Hz (video/broadcast standard)</option>
      <option value="96000">96,000 Hz (studio/high-res)</option>
      <option value="192000">192,000 Hz (high-res)</option>
    </select>
    <label for="tgt">Target sample rate</label>
    <select id="tgt">
      <option value="8000">8,000 Hz (telephone)</option>
      <option value="22050">22,050 Hz</option>
      <option value="44100" selected>44,100 Hz (CD quality)</option>
      <option value="48000">48,000 Hz (video/broadcast standard)</option>
      <option value="96000">96,000 Hz (studio/high-res)</option>
      <option value="192000">192,000 Hz (high-res)</option>
    </select>
  
    <button onclick="calc()">Calculate</button>
    <div class="result" id="result"></div>
  </div>
  <p class="note">Estimate only. Values may vary depending on the source file and browser.</p>
</div>
<script>

function calc(){
  var src = parseFloat(document.getElementById('src').value);
  var tgt = parseFloat(document.getElementById('tgt').value);
  var result = document.getElementById('result');
  var srcNy = src/2, tgtNy = tgt/2;
  var html = '';
  if (tgt === src) {
    html = '<span class="big">No change</span>Source and target are the same rate.';
  } else if (tgt < src) {
    html = '<span class="big">Downsampling</span>Frequencies above ' + (tgtNy/1000).toFixed(1) +
      ' kHz will be filtered out and cannot be recovered.';
  } else {
    html = '<span class="big">Upsampling</span>No new frequency information is added above ' +
      (srcNy/1000).toFixed(1) + ' kHz - file size increases but detail does not.';
  }
  result.innerHTML = html;
}

</script>
</body>
</html>
